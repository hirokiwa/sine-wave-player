<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Deep Bass Background Noise for Work" />
    <title>Sine Wave Player</title>
    <link rel="stylesheet" href="/src/styles/common.css" />
    <link rel="stylesheet" href="/src/styles/sine-wave-player.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="page">
      <section class="sine-wave-player" aria-labelledby="sine-wave-player-title">
        <h1 class="sine-wave-player__title" id="sine-wave-player-title">Sine Wave Player</h1>

        <div class="sine-wave-player__field">
          <label class="sine-wave-player__label" for="frequency-input">Frequency (Hz)</label>
          <input class="sine-wave-player__input" id="frequency-input" type="number" value="35" min="1" max="200" />
        </div>

        <div class="sine-wave-player__button-row" aria-label="Frequency presets">
          <button class="sine-wave-player__preset-button" type="button" data-frequency="35">
            <span aria-hidden="true">~</span>
            <span>35Hz</span>
          </button>
          <button class="sine-wave-player__preset-button" type="button" data-frequency="40">
            <span aria-hidden="true">~</span>
            <span>40Hz</span>
          </button>
        </div>

        <div class="sine-wave-player__field">
          <label class="sine-wave-player__label" for="timer-input">Timer (minute)</label>
          <input class="sine-wave-player__input" id="timer-input" type="number" placeholder="Leave blank for unlimited playback." />
        </div>

        <div class="sine-wave-player__button-row" aria-label="Timer presets">
          <button class="sine-wave-player__preset-button" type="button" data-timer="30">
            <span aria-hidden="true">◷</span>
            <span>30 min</span>
          </button>
          <button class="sine-wave-player__preset-button" type="button" data-timer="60">
            <span aria-hidden="true">◷</span>
            <span>60 min</span>
          </button>
          <button class="sine-wave-player__preset-button" type="button" data-timer="infinite">
            <span aria-hidden="true">∞</span>
            <span>∞</span>
          </button>
        </div>

        <div class="sine-wave-player__toggle-control">
          <button class="sine-wave-player__toggle-button" id="toggle-button" type="button">
            <span class="sine-wave-player__toggle-icon" aria-hidden="true">▶</span>
            <span class="sine-wave-player__toggle-label">Play</span>
          </button>
        </div>

        <output class="sine-wave-player__status" aria-live="polite">
          <span class="sine-wave-player__status-text" id="status-text">Stop</span>
          <span class="sine-wave-player__timer" id="countdown-text">∞</span>
        </output>
      </section>
    </main>
  </body>
</html>
